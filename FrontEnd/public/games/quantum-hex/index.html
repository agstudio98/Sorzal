<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quantum Hex - Sorzal Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05161E; font-family: 'Staatliches', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        canvas { cursor: crosshair; filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.2)); }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #10B981;
            text-transform: uppercase; letter-spacing: 2px; pointer-events: none;
        }
        .info-box { font-size: 24px; text-shadow: 0 0 10px #10B981; }
        #win-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #10B981; text-align: center; display: none; pointer-events: all;
            background: rgba(0,0,0,0.8); padding: 40px; border-radius: 30px; border: 2px solid #10B981;
        }
        button {
            background: #10B981; border: none; padding: 15px 30px; color: #05161E;
            font-size: 20px; cursor: pointer; border-radius: 10px; margin-top: 20px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="info-box">Estabilidad: <span id="moves">0</span> Flips</div>
    </div>
    <div id="win-screen">
        <h1>MATERIA ESTABILIZADA</h1>
        <p>Has resuelto el enigma geométrico subatómico.</p>
        <button onclick="initGame()">NUEVO NIVEL</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const movesEl = document.getElementById('moves');
        const winScreen = document.getElementById('win-screen');

        let hexSize = 50;
        let grid = [];
        let moves = 0;
        const rows = 5;
        const cols = 5;

        function initGame() {
            moves = 0;
            movesEl.innerText = moves;
            winScreen.style.display = 'none';
            grid = [];
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    grid.push({
                        r, c,
                        active: Math.random() > 0.7
                    });
                }
            }
            resize();
            draw();
        }

        function getHexPos(r, c) {
            const x = c * hexSize * 1.5 + hexSize;
            const y = r * hexSize * Math.sqrt(3) + (c % 2) * (hexSize * Math.sqrt(3) / 2) + hexSize;
            return { x, y };
        }

        function drawHex(x, y, active) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                ctx.lineTo(x + hexSize * Math.cos(i * Math.PI / 3), y + hexSize * Math.sin(i * Math.PI / 3));
            }
            ctx.closePath();
            
            ctx.fillStyle = active ? '#10B981' : '#064E3B';
            ctx.fill();
            ctx.strokeStyle = '#34D399';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (active) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#10B981';
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            grid.forEach(h => {
                const { x, y } = getHexPos(h.r, h.c);
                drawHex(x, y, h.active);
            });
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            grid.forEach(h => {
                const { x, y } = getHexPos(h.r, h.c);
                const dist = Math.sqrt((x-mx)**2 + (y-my)**2);
                if (dist < hexSize) {
                    flip(h.r, h.c);
                    moves++;
                    movesEl.innerText = moves;
                    checkWin();
                }
            });
            draw();
        };

        function flip(r, c) {
            const targets = [
                [r,c], [r-1,c], [r+1,c], 
                [r,c-1], [r,c+1],
                [c%2===0 ? r-1 : r+1, c-1],
                [c%2===0 ? r-1 : r+1, c+1]
            ];

            targets.forEach(([tr, tc]) => {
                const hex = grid.find(h => h.r === tr && h.c === tc);
                if (hex) hex.active = !hex.active;
            });
        }

        function checkWin() {
            if (grid.every(h => h.active) || grid.every(h => !h.active)) {
                setTimeout(() => {
                    winScreen.style.display = 'block';
                }, 300);
            }
        }

        function resize() {
            canvas.width = cols * hexSize * 1.6 + hexSize;
            canvas.height = rows * hexSize * 1.8 + hexSize;
        }

        window.onresize = resize;
        initGame();
    </script>
</body>
</html>

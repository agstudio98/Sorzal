
<!DOCTYPE html>
<html>
<head>
    <title>STAR HUNTER</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: #fef08a; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="ui">Collected: <span id="s">0</span></div>
    <canvas id="c"></canvas>
    <script>
        const c = document.getElementById('c'), ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        let score = 0, px = c.width/2, items = [];
        window.onmousemove = e => px = e.clientX;
        function loop() {
            ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = '#fef08a'; ctx.fillRect(px-40, c.height-40, 80, 20);
            if(Math.random() < 0.05) items.push({x: Math.random()*c.width, y: 0});
            items.forEach((it,i) => {
                it.y += 5; ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(it.x, it.y, 10, 0, 7); ctx.fill();
                if(it.y > c.height-40 && Math.abs(it.x-px) < 40) { score++; document.getElementById('s').innerText = score; items.splice(i,1); }
                if(it.y > c.height) items.splice(i,1);
            });
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
